# Compila LAY móvil (APK de Android) en cada push a main, en cada tag v* o a mano.
# Descarga: pestaña Actions -> último run -> Artifacts "LAY-android". En main/tag también sube LAY_<ver>.apk al Release.
# Firma estable (para actualizar sin desinstalar): secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD. Sin ellos se firma con la clave de depuración.
name: build-apk
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Versión
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; v="${v#v}"; else v="$(tr -d '[:space:]' < VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Keystore (si hay secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lay.keystore"
            echo "LAY_KEYSTORE=$RUNNER_TEMP/lay.keystore" >> "$GITHUB_ENV"
            echo "LAY_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "LAY_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "LAY_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "Sin keystore: el APK se firma con la clave de depuración."
          fi
      - name: Compilar APK
        run: gradle --no-daemon assembleRelease -PlayVersion=${{ steps.ver.outputs.version }} -PlayCode=${{ github.run_number }}
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk "LAY_${{ steps.ver.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LAY-android
          path: LAY_*.apk
      - name: Release
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: LAY_*.apk
